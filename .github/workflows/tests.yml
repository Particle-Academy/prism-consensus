name: Tests

on:
  push:
    branches: [main, "*.x"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    needs: third-party
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The app depends on `file:vendor/prism-acp`, a path INSIDE the repo, and
      # the two environments fill it differently: `npm run link:acp` points it
      # at the sibling working tree locally, and this checks the package out
      # into the same place. A dependency path that leaves the repository works
      # on a developer's machine and cannot work here -- which is exactly how
      # the first push failed, with every test green locally and
      # "Cannot find module '@particle-academy/prism-acp'" on all three node
      # versions.
      - name: Fetch the transport this app dogfoods
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-acp-ts
          path: vendor/prism-acp
          persist-credentials: false

      # And BUILD it. A `file:` dependency on a source repository resolves its
      # entry point and types from `dist/`, which is generated and gitignored --
      # so a fresh checkout has the source and nothing to import. Locally this
      # was already true and invisible, because the sibling tree had been built
      # by its own gates; here it surfaced as the same "Cannot find module" the
      # previous fix was supposed to have solved.
      # The harness holds per-agent session state; the transport drives the
      # agents. Both are `file:` dependencies on paths INSIDE this repo, filled
      # by `npm run link:acp` locally and by these checkouts here.
      - name: Fetch the harness this app dogfoods
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-harness-ts
          path: vendor/prism-harness
          persist-credentials: false

      - name: Build the transport
        working-directory: vendor/prism-acp
        run: |
          npm ci
          npm run build

      # Built for the same reason as the transport: a `file:` dependency on a
      # source repository resolves its entry point and types from `dist/`,
      # which is generated and gitignored, so a fresh checkout has the source
      # and nothing to import.
      - name: Build the harness
        working-directory: vendor/prism-harness
        run: |
          npm ci
          npm run build

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx vitest run

  third-party:
    name: Third-party dependency allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # This job only reads files, so it keeps no token in .git/config for
      # the fetched checker to find.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Every direct dependency must be approved on the org allowlist and still
      # maintained. The list is fetched, never vendored, so there is no copy here
      # to drift. The release guard requires this workflow to have succeeded for
      # the tagged commit, so a failure here also stops a publish.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          path: .third-party-allowlist
          persist-credentials: false

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

  release-notes:
    name: Release-notes check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # tools/check-release-notes.sh refuses a tag annotation that does not say
      # whether the release breaks anything. It runs in publish.yml's guard, and
      # a release manager runs it by hand before tagging.
      #
      # It is tested HERE because a guard nobody tried to defeat is the recurring
      # way one of these ends up checking nothing. The suite asserts both
      # directions, and its sharpest case is a note that discusses breakage in
      # prose while declaring nothing: a plain `grep -i breaking` passes that, and
      # three real annotations in this estate are exactly that shape.
      - name: tools/check-release-notes.sh must refuse what it claims to
        run: sh tools/check-release-notes.test.sh

      # The checker is vendored rather than fetched, because for a Composer
      # package the pre-tag run is the only control that can prevent publication
      # and it has to work from the tree being tagged, offline, without piping a
      # remote script into a shell. That buys a copy, and an unchecked copy is one
      # that has already drifted without telling anyone -- prism-parity found 38
      # of 111 hand-maintained copies stale. So it is diffed, not trusted.
      - name: Fetch the canonical checker
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          path: .canonical
          persist-credentials: false

      - name: The vendored checker must match the canonical one
        run: |
          for pair in check.sh:check-release-notes.sh check.test.sh:check-release-notes.test.sh; do
            diff -u ".canonical/release-notes/${pair%%:*}" "tools/${pair##*:}" || {
              echo "::error::tools/${pair##*:} has drifted from Particle-Academy/.github release-notes/${pair%%:*}. Change the canonical file and re-vendor it; do not patch the copy."
              exit 1
            }
          done
          echo "Both vendored files match the canonical checker."
          rm -rf .canonical
